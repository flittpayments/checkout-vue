      function setConfigsOption() {
        let select = document.querySelector('.configs')

        Object.keys(configs).forEach(item => {
          const option = document.createElement('option')
          const text = document.createTextNode(item);

          option.setAttribute('value', item)
          option.appendChild(text)
          select.appendChild(option)
        })
      }

      function render(el, type) {
        return (app = checkout(
          el || '#app',
          configs[type || document.querySelector('.configs').value]
        )
          .$on('success', function (model) {
            console.log('success', model)
          })
          .$on('error', function (model) {
            console.log('error', model)
          })
          .$on('ready', function (model) {
